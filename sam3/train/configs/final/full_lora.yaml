# @package _global_
# ACDC + BTCV + PROMISE12 三数据集 hybrid LoRA 全监督微调 SAM3
# Encoder/Transformer 使用 LoRA；轻量 task heads (score head, segmentation head) 全量微调
# 训练集使用 train/full_annotations.coco.json，模型选择使用 val/image_annotations.coco.json
# test split 仅用于最终评估，不在训练期间作为验证集使用
# 训练集采用平衡采样 multiplier：ACDC=3、BTCV=1、PROMISE12=3
# 有效训练图像约为 ACDC 3966、BTCV 3768、PROMISE12 3246；验证集不重复采样
# 早停监控三数据集平均 Dice：min_epochs=12, patience=6 validations, min_delta=0.002
defaults:
  - _self_

# ============================================================================
# Paths Configuration
# ============================================================================
paths:
  acdc_data_root: /home/gaoqi/dataset/using/acdc/processed/sam3_png_coco_fullframes_100_cmpb_clean
  btcv_data_root: /home/gaoqi/dataset/using/btcv/processed/png_coco_sam3_slices_cmpb_clean
  promise12_data_root: /home/gaoqi/dataset/using/promise12/processed/png_coco_sam3_cmpb_clean
  experiment_log_dir: /home/gaoqi/sam3/gq_experiment/cmpb/full_lora_acdc_btcv_promise12
  bpe_path: /home/gaoqi/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  pretrained_checkpoint: /home/gaoqi/official_ckpt/sam3_hf/sam3.pt

# ============================================================================
# Mixed Dataset Configuration (ACDC + BTCV + Promise12)
# ============================================================================
mixed_train:
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: True
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Helper Parameters
# ============================================================================
scratch:
  enable_segmentation: True
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}
  segmentation_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    use_presence: ${scratch.use_presence_eval}
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]
  num_train_workers: 8
  num_val_workers: 2
  max_data_epochs: 50
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # LoRA 专用学习率
  lr_lora: 1.0e-4
  wd: 0.01
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 8
  gradient_accumulation_steps: 1
  train_batch_size: 8
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation}

# ============================================================================
# Trainer Configuration
# ============================================================================
trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 2
  early_stopping:
    enabled: true
    monitor: "val_mean_segmentation_coco_eval_segm_Dice"
    mode: "max"
    min_epochs: 12
    patience: 6
    min_delta: 0.002
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}
  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True
  loss:
    all: ${mixed_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss
  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: torch.utils.data.ConcatDataset
        datasets:
          # ACDC 训练集
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 3
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.acdc_data_root}/train/
            ann_file: ${paths.acdc_data_root}/train/full_annotations.coco.json
          # BTCV 训练集
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 1
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.btcv_data_root}/train/
            ann_file: ${paths.btcv_data_root}/train/full_annotations.coco.json
          # Promise12 训练集
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 3
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.promise12_data_root}/train/
            ann_file: ${paths.promise12_data_root}/train/full_annotations.coco.json
      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}
    val:
      _target_: sam3.train.data.multi_val_dataset.MultiValDataset
      val_datasets:
        acdc:
          _target_: sam3.train.data.torch_dataset.TorchDataset
          dataset:
            _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            load_segmentation: ${scratch.enable_segmentation}
            coco_json_loader:
              _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
              include_negatives: true
              category_chunk_size: 10
              _partial_: true
            img_folder: ${paths.acdc_data_root}/val/
            ann_file: ${paths.acdc_data_root}/val/image_annotations.coco.json
            transforms: ${mixed_train.val_transforms}
            max_ann_per_img: 100000
            multiplier: 1
            training: false
          shuffle: False
          batch_size: ${scratch.val_batch_size}
          num_workers: ${scratch.num_val_workers}
          pin_memory: True
          drop_last: False
          collate_fn:
            _target_: sam3.train.data.collator.collate_fn_api
            _partial_: true
            repeats: ${scratch.hybrid_repeats}
            dict_key: acdc
            with_seg_masks: ${scratch.enable_segmentation}
        btcv:
          _target_: sam3.train.data.torch_dataset.TorchDataset
          dataset:
            _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            load_segmentation: ${scratch.enable_segmentation}
            coco_json_loader:
              _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
              include_negatives: true
              category_chunk_size: 10
              _partial_: true
            img_folder: ${paths.btcv_data_root}/val/
            ann_file: ${paths.btcv_data_root}/val/image_annotations.coco.json
            transforms: ${mixed_train.val_transforms}
            max_ann_per_img: 100000
            multiplier: 1
            training: false
          shuffle: False
          batch_size: ${scratch.val_batch_size}
          num_workers: ${scratch.num_val_workers}
          pin_memory: True
          drop_last: False
          collate_fn:
            _target_: sam3.train.data.collator.collate_fn_api
            _partial_: true
            repeats: ${scratch.hybrid_repeats}
            dict_key: btcv
            with_seg_masks: ${scratch.enable_segmentation}
        promise12:
          _target_: sam3.train.data.torch_dataset.TorchDataset
          dataset:
            _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            load_segmentation: ${scratch.enable_segmentation}
            coco_json_loader:
              _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
              include_negatives: true
              category_chunk_size: 10
              _partial_: true
            img_folder: ${paths.promise12_data_root}/val/
            ann_file: ${paths.promise12_data_root}/val/image_annotations.coco.json
            transforms: ${mixed_train.val_transforms}
            max_ann_per_img: 100000
            multiplier: 1
            training: false
          shuffle: False
          batch_size: ${scratch.val_batch_size}
          num_workers: ${scratch.num_val_workers}
          pin_memory: True
          drop_last: False
          collate_fn:
            _target_: sam3.train.data.collator.collate_fn_api
            _partial_: true
            repeats: ${scratch.hybrid_repeats}
            dict_key: promise12
            with_seg_masks: ${scratch.enable_segmentation}

  # Hybrid LoRA 微调 SAM3 模型
  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}
    checkpoint_path: ${paths.pretrained_checkpoint}
    load_from_HF: false
    use_lora: true
    lora_r: 8
    lora_alpha: 16.0
    lora_freeze_non_lora: true
    lora_target_components:
      - vision_encoder
      - text_encoder
      - geometry_encoder
      - detr_encoder
      - detr_decoder
    # 轻量 task-specific heads 使用全量微调，和 weak_lora.yaml 保持一致
    lora_unfreeze_components:
      - mask_decoder
      - dot_prod_scoring

  meters:
    val:
      acdc:
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/acdc
          merge_predictions: True
          postprocessor: ${scratch.segmentation_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.acdc_data_root}/val/image_annotations.coco.json
              tide: False
              iou_type: "segm"
              output_metrics: ["AP"]
              output_dice: True
              print_summary: False
      btcv:
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/btcv
          merge_predictions: True
          postprocessor: ${scratch.segmentation_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.btcv_data_root}/val/image_annotations.coco.json
              tide: False
              iou_type: "segm"
              output_metrics: ["AP"]
              output_dice: True
              print_summary: False
      promise12:
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/promise12
          merge_predictions: True
          postprocessor: ${scratch.segmentation_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.promise12_data_root}/val/image_annotations.coco.json
              tide: False
              iou_type: "segm"
              output_metrics: ["AP"]
              output_dice: True
              print_summary: False

  # Hybrid LoRA: 优化 LoRA 参数 + score/segmentation heads
  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16
    optimizer:
      _target_: torch.optim.AdamW
    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2
    param_group_modifiers: []
    param_allowlist_patterns:
      - "*lora_A*"
      - "*lora_B*"
      - "segmentation_head.*"
      - "dot_prod_scoring.*"
    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_lora}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "*lora_A*"
            - "*lora_B*"
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_lora}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "segmentation_head.*"
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_lora}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "dot_prod_scoring.*"
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 5
    save_best_meters: []
    save_best_combined_meters:
      - name: "val_mean_segmentation_coco_eval_segm_AP"
        mode: "max"
        metric_keys:
          - "val_acdc/segmentation/coco_eval_segm_AP"
          - "val_btcv/segmentation/coco_eval_segm_AP"
          - "val_promise12/segmentation/coco_eval_segm_AP"
      - name: "val_mean_segmentation_coco_eval_segm_Dice"
        mode: "max"
        metric_keys:
          - "val_acdc/segmentation/coco_eval_segm_Dice"
          - "val_btcv/segmentation/coco_eval_segm_Dice"
          - "val_promise12/segmentation/coco_eval_segm_Dice"

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/mixed
    log_freq: 10

launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: True
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null

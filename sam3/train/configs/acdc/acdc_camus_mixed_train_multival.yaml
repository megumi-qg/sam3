# @package _global_
defaults:
  - _self_

# ============================================================================
# 数据集采样说明
# ============================================================================
# 本配置使用 PyTorch 的 ConcatDataset 合并 ACDC 和 CAMUS 数据集
#
# 【训练集组成】
# - ACDC train 数据集
# - CAMUS train 数据集
# - CAMUS val 数据集（因为 CAMUS test 已用作验证集，所以 val 可以加入训练）
#
# 【训练集采样方式】
# - ConcatDataset 会按顺序连接三个数据集：ACDC train -> CAMUS train -> CAMUS val
# - 但由于训练时设置了 shuffle=True 和 DistributedSampler，会随机打乱整个
#   ConcatDataset 的索引，因此实际训练时是**混合随机采样**的
# - 每个 epoch 都会重新打乱，确保所有数据集的样本充分混合
#
# 【验证集采样方式】
# - 验证集使用 shuffle=False，因此会**按顺序采样**：
#   先遍历完 ACDC test 的所有验证样本，再遍历 CAMUS test 的所有验证样本
# - 这样设计是为了便于分别评估两个数据集的性能
#
# 如果需要调整数据集之间的采样比例，可以修改各自的 multiplier 参数
# ============================================================================

# ============================================================================
# Paths Configuration
# ============================================================================
paths:
  # ACDC数据集路径
  acdc_data_root: /home/gaoqi/sam3/dataset/ACDC
  # CAMUS数据集路径
  camus_data_root: /home/gaoqi/sam3/dataset/CAMUS
  # 实验日志目录
  experiment_log_dir: /home/gaoqi/sam3/experiment/acdc_camus_mixed_finetune_multival
  # BPE 路径
  bpe_path: /home/gaoqi/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  # 预训练模型路径
  pretrained_checkpoint: /home/gaoqi/official_ckpt/sam3_hf/sam3.pt

# ============================================================================
# Text Prompt Configuration (多Prompt增强)
# ============================================================================
# 为每个类别ID定义多个text prompt，训练时会随机选择其中一个
# 这样可以增强模型对不同文本描述的鲁棒性
# acdc_prompts:
#   # ACDC数据集类别ID和对应的多prompt列表
#   - id: 1
#     name: ["Right Ventricle", "Right Ventricle in MRI", "Right Ventricle in Short Axis view"]
#   - id: 2
#     name: ["Left Ventricle Myocardium", "Left Ventricle Myocardium in MRI", "Left Ventricle Myocardium in Short Axis view", "Heart muscle ring in MRI"]
#   - id: 3
#     name: ["Left Ventricle", "Left Ventricle in MRI", "Left Ventricle in Short Axis view"]

# camus_prompts:
#   # CAMUS数据集类别ID和对应的多prompt列表
#   - id: 1
#     name: ["Left Ventricle", "Left Ventricle in echocardiography", "Left Ventricle in Ultrasound", "Left Ventricle in Apical view"]
#   - id: 2
#     name: ["Left Ventricle Myocardium", "Left Ventricle Myocardium in echocardiography", "Left Ventricle Myocardium in Ultrasound", "Left Ventricle Myocardium in Apical view"]
#   - id: 3
#     name: ["Left Atrium", "Left Atrium in echocardiography", "Left Atrium in Ultrasound", "Left Atrium in Apical view"]

# ============================================================================
# Mixed Dataset Configuration (ACDC + CAMUS)
# ============================================================================
mixed_train:
  # Training transforms pipeline (两个数据集共享相同的transforms)
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        # 必须解码 RLE 格式的 mask，因为你的 json 里是 RLE 编码
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        # 验证集也需要解码 RLE
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # Loss Config (With Mask Loss ENABLED)
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: True
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      # 这里的 Masks loss 是必须的
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false

    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Helper Parameters
# ============================================================================
scratch:
  # 开启分割
  enable_segmentation: True 
  
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1 
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}
  
  # Segmentation postprocessor
  segmentation_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true 
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True

  # Image resolution
  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 10
  num_val_workers: 0
  max_data_epochs: 50
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # LR Scheduler
  lr_scale: 0.1
  lr_transformer: ${times:8e-4,${scratch.lr_scale}}
  lr_vision_backbone: ${times:2.5e-4,${scratch.lr_scale}}
  lr_language_backbone: ${times:5e-5,${scratch.lr_scale}}
  lrd_vision_backbone: 0.9
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  # Batch Sizes，指分配到每张卡的batch_size
  val_batch_size: 8
  # dict_key 的作用：用于匹配 loss 和 meter 配置。
  # 在 _step 中会从 batch 中提取 dict_key，并用它查找对应的 loss 和 meter。
  # 注意：collate_fn_val 在这里不需要配置，因为 MultiValDataset 中每个验证数据集
  # 都有自己的 collate_fn 配置（见 trainer.data.val.val_datasets 部分）

  gradient_accumulation_steps: 1
  train_batch_size: 8
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation}

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: ${scratch.max_data_epochs}
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${mixed_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        # 使用 ConcatDataset 合并 ACDC 和 CAMUS 数据集
        _target_: torch.utils.data.ConcatDataset
        datasets:
          # ACDC 数据集
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 1
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.acdc_data_root}/train/
            ann_file: ${paths.acdc_data_root}/train/image_annotations.coco.json
            # coco_json_loader:
            #   _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
            #   prompts: ${acdc_prompts}
            #   _partial_: true
          # CAMUS 训练集
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 1
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.camus_data_root}/train/
            ann_file: ${paths.camus_data_root}/train/image_annotations.coco.json
            # coco_json_loader:
            #   _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
            #   prompts: ${camus_prompts}
            #   _partial_: true
          # CAMUS 验证集（加入训练集，因为test集已用作验证集）
          - _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            transforms: ${mixed_train.train_transforms}
            load_segmentation: ${scratch.enable_segmentation}
            max_ann_per_img: 500000
            multiplier: 1
            max_train_queries: 50000
            max_val_queries: 50000
            training: true
            use_caching: False
            img_folder: ${paths.camus_data_root}/val/
            ann_file: ${paths.camus_data_root}/val/image_annotations.coco.json
            # coco_json_loader:
            #   _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
            #   prompts: ${camus_prompts}
            #   _partial_: true

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      # 使用 MultiValDataset 包装多个验证数据集
      _target_: sam3.train.data.multi_val_dataset.MultiValDataset
      val_datasets:
        acdc:
          _target_: sam3.train.data.torch_dataset.TorchDataset
          dataset:
            _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            load_segmentation: ${scratch.enable_segmentation}
            coco_json_loader:
              _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
              # prompts: ${acdc_prompts}
              include_negatives: true
              category_chunk_size: 10
              _partial_: true
            img_folder: ${paths.acdc_data_root}/test/
            ann_file: ${paths.acdc_data_root}/test/image_annotations.coco.json
            transforms: ${mixed_train.val_transforms}
            max_ann_per_img: 100000
            multiplier: 1
            training: false
          shuffle: False
          batch_size: ${scratch.val_batch_size}
          num_workers: ${scratch.num_val_workers}
          pin_memory: True
          drop_last: False
          collate_fn:
            _target_: sam3.train.data.collator.collate_fn_api
            _partial_: true
            repeats: ${scratch.hybrid_repeats}
            dict_key: acdc
            with_seg_masks: ${scratch.enable_segmentation}
        camus:
          _target_: sam3.train.data.torch_dataset.TorchDataset
          dataset:
            _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
            load_segmentation: ${scratch.enable_segmentation}
            coco_json_loader:
              _target_: sam3.train.data.coco_json_loaders.COCO_FROM_JSON
              # prompts: ${camus_prompts}
              include_negatives: true
              category_chunk_size: 10
              _partial_: true
            img_folder: ${paths.camus_data_root}/test/
            ann_file: ${paths.camus_data_root}/test/image_annotations.coco.json
            transforms: ${mixed_train.val_transforms}
            max_ann_per_img: 100000
            multiplier: 1
            training: false
          shuffle: False
          batch_size: ${scratch.val_batch_size}
          num_workers: ${scratch.num_val_workers}
          pin_memory: True
          drop_last: False
          collate_fn:
            _target_: sam3.train.data.collator.collate_fn_api
            _partial_: true
            repeats: ${scratch.hybrid_repeats}
            dict_key: camus
            with_seg_masks: ${scratch.enable_segmentation}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cpus
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}
    checkpoint_path: ${paths.pretrained_checkpoint}
    load_from_HF: false

  meters:
    val:
      acdc:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/acdc
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.acdc_data_root}/test/image_annotations.coco.json
              tide: False
              iou_type: "bbox"
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/acdc
          merge_predictions: True
          postprocessor: ${scratch.segmentation_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.acdc_data_root}/test/image_annotations.coco.json
              tide: False
              iou_type: "segm"
      camus:
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/camus
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.camus_data_root}/test/image_annotations.coco.json
              tide: False
              iou_type: "bbox"
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/camus
          merge_predictions: True
          postprocessor: ${scratch.segmentation_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.camus_data_root}/test/image_annotations.coco.json
              tide: False
              iou_type: "segm"

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    param_group_modifiers:
      - _target_: sam3.train.optim.optimizer.layer_decay_param_modifier
        _partial_: True
        layer_decay_value: ${scratch.lrd_vision_backbone}
        apply_to: 'backbone.vision_backbone.trunk'
        overrides:
          - pattern: '*pos_embed*'
            value: 1.0

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_transformer}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_vision_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.vision_backbone.*'
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_language_backbone}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - 'backbone.language_backbone.*'

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 5
    save_best_meters:
      - "val_acdc/detection"
      - "val_acdc/segmentation"
      - "val_camus/detection"
      - "val_camus/segmentation"

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/mixed
    log_freq: 10

# ============================================================================
# Launcher Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: True
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null

